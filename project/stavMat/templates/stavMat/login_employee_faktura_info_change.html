{% extends "stavMat/base_customer.html" %}
{% load static %}

{% block head %}
    <link href="{% static 'register_customer.css' %}" rel="stylesheet">
    <link href="{% static 'form_base.css' %}" rel="stylesheet">
{% endblock %}

{% block body %}
    <div class="container section">
        <div class="card">
            <div class="card-body">
                <h4 class="card-title">Zmena informácii o faktúre</h4>
                <form action="{% url 'faktura_edit' faktura.pk%}" method="post">{% csrf_token %}
                    <div class="row mb-4">
                        {{ faktura_form.as_p }}
                    </div>
                    <button class="btn" type="submit">Uložiť</button>
                </form>
                    <div class="row">
                        <div class="col">
                            <a class="btn" type="submit" href="{% url 'employee_faktura' %}">Vrátiť sa naspäť</a>
                        </div>
                    </div>
            </div>
        </div>
    </div>
{% endblock %}
