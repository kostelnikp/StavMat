{% load static %}

<!DOCTYPE html>
<html lang="cz">
<head>
    <meta charset="UTF-8">
    <title>StavMat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'index.css' %}">
    {% block head %}
    {% endblock %}
</head>
<body>
<div class="container">
    <div class="header">
        <a href="{% url 'index' %}">
            <img src="{% static 'resources/Logo.png' %}" width="225" height="140.28">
        </a>
        {% block title %}
            <h4>Vitajte v stavebnej firme StavMat</h4>
        {% endblock %}
    </div>
    <div class="body">
        {% block body %}
        <a class="btn" type="button" href="{% url 'login_employee' %}">Vstúpiť na stránku pre zamestnancov</a>
        <a class="btn" type="button" href="{% url 'customer' %}">Vstúpiť na stránku pre zákazníkov</a>
        {% endblock %}
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>


</body>
</html>
